name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            sed -i "s|__MAPS_API_KEY__|${MAPS_API_KEY}|" www/js/config.js
            echo "Maps key injected."
          else
            echo "::warning::MAPS_API_KEY secret is not set — the map screens will show a 'not configured' message."
          fi

      - name: Create Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npx cap add android
          node scripts/configure-android.mjs

      - name: Generate app icons & splash
        run: npx capacitor-assets generate --android || echo "::warning::Icon generation failed; using default icons."

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK + AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Sign release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=android/app/build/outputs
          "$BT/zipalign" -p -f 4 "$OUT/apk/release/app-release-unsigned.apk" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out landier-release.apk aligned.apk
          "$BT/apksigner" verify landier-release.apk
          cp "$OUT/bundle/release/app-release.aab" landier-release.aab
          jarsigner -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            landier-release.aab "$KEY_ALIAS"
          rm -f release.jks aligned.apk

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/landier-debug.apk
          if [ -f landier-release.apk ]; then cp landier-release.apk landier-release.aab dist/; fi
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: landier-android-${{ github.run_number }}
          path: dist/*
          retention-days: 30

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
